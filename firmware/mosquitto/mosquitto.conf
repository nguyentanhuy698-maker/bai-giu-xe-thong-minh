# Mosquitto trên laptop đặt ở chốt bảo vệ
# Chạy: mosquitto -c mosquitto.conf -v
# Cổng 1883: ESP32 trụ điều khiển và server_mock.py
listener 1883
# Cổng 9001: trang quản lý (MQTT qua WebSocket), nhập ws://IP-laptop:9001 trong Máy giữ xe → Cài đặt kết nối
listener 9001
protocol websockets
# Mô hình trong mạng nội bộ: cho vào không cần mật khẩu.
# Muốn bật mật khẩu: tạo file bằng  mosquitto_passwd -c matkhau.txt tru  rồi đổi 2 dòng dưới.
allow_anonymous true
# password_file matkhau.txt
